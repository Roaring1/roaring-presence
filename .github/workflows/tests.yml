name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional image dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Compile maintained Python entry points
        run: |
          python -m py_compile \
            core/bin/roaring-presenced \
            core/bin/roaring-presence-doctor \
            providers/audio-cd/bin/roaring-cd-presence \
            providers/audio-cd/bin/roaring-cd-autoplay \
            providers/audio-cd/bin/roaring-cd-player \
            providers/minecraft/bin/roaring-minecraft-presence \
            tools/assets/bin/roaring-presence-art.py \
            tools/assets/bin/roaring-presence-assets \
            tests/test_regressions.py
      - name: Validate sample configuration
        run: python -m json.tool config/config.sample.json >/dev/null
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate installer syntax
        run: bash -n install.sh
