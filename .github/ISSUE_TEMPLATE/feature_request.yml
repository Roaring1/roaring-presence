name: Feature request
description: Suggest an improvement or a new optional integration.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Standalone CD player
        - Discord Rich Presence
        - Installer / updater
        - Minecraft provider
        - Artwork tools
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what currently makes it difficult?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would expect. Optional features should remain optional where practical.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
